[project]
name = "aurabee-simulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1.0",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "aurabee-schema",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aurabee_sim*"]
