# Dev broker. Anonymous access is fine locally because every telemetry payload
# is independently HMAC-signed and verified by the ingest service
# (see apps/api/aurabee_api/telemetry/auth.py). In a cluster deployment this
# is replaced by per-node MQTT credentials + TLS.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# A fast-forward simulator run publishes a whole season in seconds. The default
# per-client queue (1000) silently discards QoS-1 messages beyond that, which
# looks exactly like data loss in the database.
max_queued_messages 500000
max_inflight_messages 200
